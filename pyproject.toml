[project]
name = "jig"
version = "0.1.0"
description = "Minimal agent framework — five interfaces, one run function, everything swappable."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Rank One Labs"},
]
maintainers = [
    {name = "Rank One Labs"},
]
requires-python = ">=3.12"
keywords = ["agent", "llm", "framework", "orchestration", "tracing", "evaluation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/rankonelabs/jig"
Issues = "https://github.com/rankonelabs/jig/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
openrouter = ["openai>=1.50"]
google = ["google-genai>=1.0"]
ollama = ["ollama>=0.4"]
honcho = ["honcho>=0.1"]
zep = ["zep-python>=2.0"]
callback = ["aiohttp>=3.9"]
eval = ["pyyaml>=6.0"]
# 4.18 is the referencing-rewrite boundary (jsonschema<4.18 vendors its own
# $ref resolution; >=4.18 delegates to the separate `referencing` package).
validate = ["jsonschema>=4.18"]
all = ["jig[anthropic,openai,openrouter,google,ollama,honcho,zep,callback,eval,validate]"]
# jsonschema is here for the same reason pyyaml is: it is an optional
# extra's runtime dependency (validate / eval respectively) that the test
# suite needs regardless, because tests/test_validate_arguments.py guards on
# `importorskip("jsonschema")`. Without it in dev, CI's `uv sync --extra dev
# --extra callback` would skip that module wholesale and the feature would
# ship with zero coverage while the run still read green.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pyyaml>=6.0", "jsonschema>=4.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
